name: image
# The companion module's image: its tests on every change, the image on main.
on:
  push:
    branches: [main]
    paths: ['companion/**', '.github/workflows/image.yml']
  pull_request:
    paths: ['companion/**', '.github/workflows/image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: tests
        working-directory: companion
        run: npm ci && npm test
      - name: build
        run: |
          v=$(node -p "require('./companion/package.json').version")
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/kiwi-companion:$v" >> "$GITHUB_ENV"
          docker build -t "ghcr.io/${GITHUB_REPOSITORY_OWNER}/kiwi-companion:$v" -f companion/Containerfile companion
      - name: it starts, and says what it lacks
        run: |
          out=$(docker run --rm --read-only --tmpfs /tmp --cap-drop ALL "$image" 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "No Discord bot token"
      - name: push a version that is not there yet (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$image" >/dev/null 2>&1; then echo "$image exists: bump the version in companion/package.json to publish a new one"; exit 0; fi
          docker push "$image"
